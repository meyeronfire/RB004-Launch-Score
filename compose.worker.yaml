services:
  scanner:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env.worker
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m
    shm_size: 256m
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    stop_grace_period: 30s
    restart: unless-stopped
