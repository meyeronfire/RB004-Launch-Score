services:
  scanner:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env.worker
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp:${SCAN_WORKER_SECCOMP_PROFILE:?Set the path to the verified scanner seccomp profile}
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m
    shm_size: 256m
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    stop_grace_period: 30s
    restart: unless-stopped
